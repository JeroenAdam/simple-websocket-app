<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat & Notes</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Segoe UI', 'system-ui', '-apple-system', 'sans-serif'] },
          animation: { 'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
        }
      }
    }
  </script>
  <!-- Quill 2.0 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <style>
    /* Scrollbar */
    #messages::-webkit-scrollbar, .ql-container::-webkit-scrollbar, #logContentMain::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track, .ql-container::-webkit-scrollbar-track, #logContentMain::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb, .ql-container::-webkit-scrollbar-thumb, #logContentMain::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    #messages::-webkit-scrollbar-thumb:hover, .ql-container::-webkit-scrollbar-thumb:hover, #logContentMain::-webkit-scrollbar-thumb:hover { background: #64748b; }
    #messages, .ql-container, #logContentMain { scrollbar-width: thin; scrollbar-color: #475569 transparent; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Lightbox */
    #lightbox { transition: opacity 0.2s ease; }
    #lightbox.hidden { display: none; opacity: 0; pointer-events: none; }
    #lightbox:not(.hidden) { display: flex; opacity: 1; }
    #lightboxImg { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    #lightbox.hidden #lightboxImg { transform: scale(0.95); }
    #lightbox:not(.hidden) #lightboxImg { transform: scale(1); }

    /* Quill Dark Theme Overrides */
    .ql-toolbar { background: #1e293b !important; border-bottom: 1px solid #334155 !important; }
	.ql-toolbar.ql-snow { border: none !important; }
    .ql-container { background: #0f172a !important; border: none !important; color: #e2e8f0 !important; }
    .ql-editor { min-height: 60vh; font-size: 15px; }
	.ql-editor::before,	p.ql-blank::before { color: #94a3b8 !important; opacity: 1 !important; }
	.ql-editing { left: 1rem !important; }
    .ql-snow .ql-stroke { stroke: #94a3b8 !important; }
    .ql-snow .ql-fill { fill: #94a3b8 !important; }
    .ql-snow .ql-picker-label { color: #94a3b8 !important; }
    .ql-snow .ql-active { color: #60a5fa !important; }
    .ql-snow .ql-active .ql-stroke { stroke: #60a5fa !important; }
    .ql-picker-options { background: #1e293b !important; border: 1px solid #334155 !important; }
    .ql-picker-item { color: #94a3b8 !important; }
    .ql-tooltip { background: #1e293b !important; border: 1px solid #334155 !important; color: #e2e8f0 !important; }
    .ql-tooltip input { background: transparent !important; color: #e2e8f0 !important; border: 1px solid #334155 !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center font-sans p-4">

  <!-- Sidebar Toggle -->
  <button id="sidebarToggle" class="fixed top-4 left-4 z-40 p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 transition-colors shadow-lg">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg>
  </button>

  <!-- Sidebar Overlay -->
  <div id="sidebarOverlay" class=""></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-54 bg-slate-800 border-r border-slate-700 transform -translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col shadow-2xl">
    <header class="flex items-center justify-between px-5 py-4 bg-slate-900 border-b border-slate-700 shrink-0">
      <h4 class="text-lg font-semibold text-white flex items-center gap-2">Chat History&nbsp;&nbsp;&nbsp;</h4>
      <button id="closeSidebar" class="text-slate-400 hover:text-white transition-colors p-1 rounded-md hover:bg-slate-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>

    <!-- Log List (Tabs) -->
    <div id="logList" class="flex-1 overflow-y-auto p-3 space-y-1">
      <div class="text-center text-slate-500 mt-10">Click a log to view</div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div id="mainContainer" class="w-[72%] h-[85vh] transition-all duration-300">
    
    <!-- Live View (Notes + Chat) -->
    <div id="liveView" class="grid grid-cols-1 lg:grid-cols-2 gap-4 h-full">
      
      <!-- Notes Pane -->
      <div class="bg-slate-800 rounded-xl shadow-2xl overflow-hidden flex flex-col border border-slate-700">
        <header class="flex items-center justify-between px-5 py-4 bg-slate-900 border-b border-slate-700 shrink-0">
          <h1 class="text-lg font-semibold text-white flex items-center gap-2"><span>📝</span> Notes</h1>
          <span id="saveStatus" class="text-xs text-slate-500">Auto-saved</span>
        </header>
        <div id="editor" class="flex-1 overflow-hidden"></div>
      </div>

      <!-- Chat Pane -->
      <div class="bg-slate-800 rounded-xl shadow-2xl overflow-hidden flex flex-col border border-slate-700">
        <header class="flex items-center justify-between px-5 py-4 bg-slate-900 border-b border-slate-700 shrink-0">
          <h1 class="text-lg font-semibold text-white flex items-center gap-2"><span>💬</span> Chat</h1>
          <div id="statusBadge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium transition-colors duration-300 bg-slate-700 text-slate-400">
            <span class="w-2 h-2 rounded-full bg-current"></span>
            <span id="statusText">Disconnected</span>
          </div>
        </header>

        <div id="messages" class="flex-1 overflow-y-auto p-5 flex flex-col gap-3 scroll-smooth"></div>

        <div id="configBar" class="flex items-center gap-2 px-5 py-3 bg-slate-900 border-t border-slate-700 shrink-0">
          <label for="wsUrl" class="text-xs text-slate-500 font-medium uppercase tracking-wide">WS URL:</label>
          <input id="wsUrl" type="text" value="ws://192.168.0.1" placeholder="ws://192.168.0.1" 
                 class="flex-1 bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 transition-colors disabled:opacity-50" />
        </div>

        <div class="p-4 bg-slate-900 border-t border-slate-700 shrink-0">
          <div class="flex gap-2">
            <button id="connectBtn" class="px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors bg-blue-600 text-white hover:bg-blue-700 active:scale-95">Connect</button>
            <input id="msgInput" type="text" placeholder="Type a message or paste an image/video…" disabled 
                   class="flex-1 bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" />
            <button id="sendBtn" class="px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors bg-sky-500 text-white hover:bg-sky-600 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">Send</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Log Viewer (Hidden initially) -->
    <div id="logViewerMain" class="hidden flex flex-col h-full bg-slate-800 rounded-xl shadow-2xl border border-slate-700 overflow-hidden">
      <header class="flex items-center justify-between px-5 py-4 bg-slate-900 border-b border-slate-700 shrink-0">
        <h2 class="text-lg font-semibold text-white flex items-center gap-2"><span>📜</span> <span id="logDateDisplay">Select a log</span></h2>
        <button id="backToLive" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 transition-colors flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Go back
        </button>
      </header>
      <div id="logContentMain" class="flex-1 overflow-y-auto p-6 space-y-2 text-sm font-mono"></div>
    </div>

  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 z-30 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <button id="lightboxClose" class="absolute top-4 right-4 text-white hover:text-red-400 transition-colors w-8 h-8 flex items-center justify-center rounded-full bg-slate-900/50 border border-slate-700">✕</button>
    <img id="lightboxImg" src="" alt="Full Image" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain" />
  </div>

<!-- ── Scripts ─────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
(() => {
  // DOM refs
  const messagesEl   = document.getElementById('messages');
  const msgInput     = document.getElementById('msgInput');
  const sendBtn      = document.getElementById('sendBtn');
  const connectBtn   = document.getElementById('connectBtn');
  const statusBadge  = document.getElementById('statusBadge');
  const statusText   = document.getElementById('statusText');
  const wsUrlInput   = document.getElementById('wsUrl');
  const configBar    = document.getElementById('configBar');
  const lightbox     = document.getElementById('lightbox');
  const lightboxImg  = document.getElementById('lightboxImg');
  const lightboxClose= document.getElementById('lightboxClose');
  const saveStatus   = document.getElementById('saveStatus');

  // Sidebar & View refs
  const sidebar      = document.getElementById('sidebar');
  const overlay      = document.getElementById('sidebarOverlay');
  const toggleBtn    = document.getElementById('sidebarToggle');
  const closeBtn     = document.getElementById('closeSidebar');
  const logList      = document.getElementById('logList');
  const liveView     = document.getElementById('liveView');
  const logViewerMain= document.getElementById('logViewerMain');
  const logDateDisplay = document.getElementById('logDateDisplay');
  const backToLiveBtn= document.getElementById('backToLive');
  const logContentMain = document.getElementById('logContentMain');

  let ws = null;
  let reconnectTimer = null;
  const RECONNECT_DELAY = 3000;
  const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
  const MAX_VIDEO_SIZE = 10 * 1024 * 1024;
  const API_BASE = 'http://localhost:80';

  // ── Quill Editor Setup ───────────────────────────
  const quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: 'Start typing...',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }, 'bold', 'italic', 'underline', 'blockquote'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'list': 'bullet' }, { 'align': [] }],
        ['link', 'image', 'video'],
        ['clean']
      ]
    }
  });

  const savedNotes = localStorage.getItem('chat-notes');
  if (savedNotes) quill.root.innerHTML = savedNotes;

  let saveTimeout;
  quill.on('text-change', () => {
    saveStatus.textContent = 'Saving...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      localStorage.setItem('chat-notes', quill.root.innerHTML);
      saveStatus.textContent = 'Auto-saved';
    }, 800);
  });

  // ── Helpers ──────────────────────────────────────
  function timestamp() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function parseLinks(text) {
    let safe = escapeHtml(text);
    const urlRegex = /((?:https?):\/\/[^\s<>"{}|\\^`\[\]]+)/g;
    return safe.replace(urlRegex, `<a href="$1" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline break-all">$1</a>`);
  }

  function createMessageHTML(text, type) {
    const time = timestamp();
    
    if (type === 'system') {
      return `<div class="self-center text-xs italic text-slate-500 my-2">${escapeHtml(text)} <span class="opacity-50 mx-1">•</span> ${time}</div>`;
    }

    let isImage = text.startsWith('data:image/');
    let isVideo = text.startsWith('data:video/');
    let username = '';
    
    if (!isImage && !isVideo) {
      const match = text.match(/^\[(.*?)\]\s*(data:(image|video)\/.*)$/);
      if (match) {
        username = match[1];
        text = match[2];
        isImage = text.startsWith('data:image/');
        isVideo = text.startsWith('data:video/');
      }
    }

    let content;
    if (isImage) {
      content = `<img src="${text}" alt="Shared Image" class="max-w-full max-h-[300px] rounded-lg object-contain cursor-pointer chat-image hover:opacity-90 transition-opacity" />`;
    } else if (isVideo) {
      content = `<video src="${text}" controls class="max-w-full max-h-[300px] rounded-lg shadow-md bg-black" playsinline webkit-playsinline></video>`;
    } else {
      content = parseLinks(text);
    }

    const bubbleClass = type === 'sent' 
      ? "bg-blue-600 text-white rounded-tr-sm" 
      : "bg-slate-700 text-slate-100 rounded-tl-sm";
    const alignClass = type === 'sent' ? "self-end items-end" : "self-start items-start";
    const timeMargin = type === 'sent' ? "mr-1" : "ml-1";
    const userLabel = username ? `<span class="text-xs text-slate-400 mb-1 block px-1">${username}</span>` : '';

    return `
      <div class="${alignClass} flex flex-col animate-[fadeIn_0.2s_ease-out]">
        ${userLabel}
        <div class="${bubbleClass} px-4 py-2 rounded-2xl shadow-md break-words leading-relaxed max-w-[85%]">
          ${content}
        </div>
        <span class="text-[10px] text-slate-500 mt-1 ${timeMargin}">${time}</span>
      </div>`;
  }

  function addMessage(text, type = 'system') {
    const div = document.createElement('div');
    div.innerHTML = createMessageHTML(text, type);
    messagesEl.appendChild(div);
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function setStatus(state) {
    if (state === 'connected') {
      statusBadge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium transition-colors duration-300 bg-emerald-900/50 text-emerald-400 border border-emerald-800";
      statusText.textContent = 'Connected';
      const dot = statusBadge.querySelector('span'); 
      if(dot) dot.classList.add('animate-pulse-slow');
    } else {
      statusBadge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium transition-colors duration-300 bg-red-900/50 text-red-400 border border-red-800";
      statusText.textContent = 'Disconnected';
      const dot = statusBadge.querySelector('span'); 
      if(dot) dot.classList.remove('animate-pulse-slow');
    }
  }

  function setInputsEnabled(enabled) {
    msgInput.disabled   = !enabled;
    sendBtn.disabled    = !enabled;
    wsUrlInput.disabled = enabled;
    
    if (enabled) {
      connectBtn.textContent = 'Disconnect';
      connectBtn.classList.replace('bg-blue-600', 'bg-red-900');
      connectBtn.classList.replace('text-white', 'text-red-200');
      connectBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-800');
    } else {
      connectBtn.textContent = 'Connect';
      connectBtn.classList.replace('bg-red-900', 'bg-blue-600');
      connectBtn.classList.replace('text-red-200', 'text-white');
      connectBtn.classList.replace('hover:bg-red-800', 'hover:bg-blue-700');
    }
  }

  function sendPayload(payload) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(payload);
    addMessage(payload, 'sent');
  }

  // ── Sidebar & View Logic ─────────────────────────
  function openSidebar() {
    sidebar.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
    if (logList.children.length === 0 || logList.querySelector('.text-center')) fetchLogs();
  }

  function closeSidebar() {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }

  async function fetchLogs() {
    logList.innerHTML = '<div class="p-6 text-center text-slate-500 animate-pulse">Loading logs...</div>';
    try {
      const res = await fetch(`${API_BASE}/api/logs`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const files = await res.json();
      logList.innerHTML = '';
      if (files.length === 0) {
        logList.innerHTML = '<div class="p-6 text-center text-slate-500">No logs found yet.</div>';
        return;
      }
      files.forEach(file => {
        const btn = document.createElement('button');
        btn.className = 'w-full py-2.5 rounded-lg hover:bg-slate-700 text-sm text-slate-300 transition-colors flex justify-center items-center group';
        const date = file.replace('websocket-', '').replace('.log', '');
        btn.innerHTML = `<span class="group-hover:text-white">📅 ${date}</span>`;
        btn.onclick = () => { loadLog(file, date); };
        logList.appendChild(btn);
      });
    } catch (e) {
      console.error('Sidebar fetch error:', e);
      logList.innerHTML = `<div class="p-4 text-center text-red-400 text-sm">Failed to load logs.<br><small>Ensure Node server is running on port 80</small></div>`;
    }
  }


  async function loadLog(filename, displayDate) {
    logDateDisplay.textContent = `${displayDate}`;
    logContentMain.innerHTML = '<div class="p-6 text-center text-slate-500 animate-pulse">Loading content...</div>';
    
    // Switch views
    liveView.classList.add('hidden');
    logViewerMain.classList.remove('hidden');
    
    try {
      const res = await fetch(`${API_BASE}/api/logs/${filename}`);
      if (!res.ok) throw new Error('Failed to load');
      const text = await res.text();
      const lines = text.split('\n').filter(l => l.trim());
      logContentMain.innerHTML = lines.map(formatLogLine).join('');
      setTimeout(() => logContentMain.scrollTop = logContentMain.scrollHeight, 50);
    } catch (e) {
      console.error('Log content fetch error:', e);
      logContentMain.innerHTML = `<div class="p-4 text-red-400 text-sm">Failed to load log content.</div>`;
    }
  }

  function formatLogLine(line) {
    const match = line.match(/^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]\s*(.*)$/);
    if (!match) return `<div class="text-slate-500 text-xs mb-1">${escapeHtml(line)}</div>`;
    const [, time, content] = match;
    const formattedContent = escapeHtml(content).replace(/(📨|🖼️|🎥|⚠️)/g, '<span class="text-yellow-400">$1</span>');
    return `
      <div class="flex gap-3 text-xs mb-2 border-b border-slate-700/50 pb-2 last:border-0">
        <span class="text-slate-500 font-mono shrink-0 pt-0.5">${time}</span>
        <span class="text-slate-300 break-all leading-relaxed">${formattedContent}</span>
      </div>`;
  }

  toggleBtn.addEventListener('click', openSidebar);
  closeBtn.addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);
  
  // Go back restores live view momentarily
  backToLiveBtn.addEventListener('click', () => {
    logViewerMain.classList.add('hidden');
    liveView.classList.remove('hidden');
	closeSidebar();
  });

  // ── WebSocket Logic ──────────────────────────────
  function connect() {
    const url = wsUrlInput.value.trim();
    if (!url) return addMessage('Please enter a WebSocket URL.', 'system');
    disconnect();
    addMessage(`Connecting to ${url}…`, 'system');
    setStatus('disconnected');

    try { ws = new WebSocket(url); } catch (err) { addMessage(`Invalid URL: ${err.message}`, 'system'); return; }

    ws.onopen = () => {
      setStatus('connected');
      setInputsEnabled(true);
      addMessage('Connected! You can now send messages or paste images/videos.', 'system');
      configBar.style.display = 'none';
      setTimeout(() => msgInput.focus(), 200);
    };

    ws.onmessage = (event) => {
      const raw = event.data;
      if (raw.startsWith('[img]')) { addMessage(raw.slice(5), 'received'); return; }
      if (raw.startsWith('[vid]')) { addMessage(raw.slice(5), 'received'); return; }
      if (raw.startsWith('[system] ')) { addMessage(raw.slice(9), 'system'); }
      else if (raw.startsWith('[') && raw.includes('] ')) {
        const splitIdx = raw.indexOf('] ');
        const name = raw.substring(1, splitIdx);
        const text = raw.substring(splitIdx + 2);
        addMessage(`[${name}] ${text}`, 'received');
      } else { addMessage(raw, 'received'); }
    };

    ws.onerror = () => {};
    ws.onclose = (event) => {
      setStatus('disconnected');
      setInputsEnabled(false);
      configBar.style.display = 'flex';
      if (!event.wasClean) {
        addMessage(`Connection lost (code ${event.code}). Reconnecting in ${RECONNECT_DELAY / 1000}s…`, 'system');
        scheduleReconnect();
      } else { addMessage('Disconnected by server.', 'system'); }
    };
  }

  function disconnect() {
    if (reconnectTimer) clearTimeout(reconnectTimer);
    if (ws) { ws.close(1000, 'Client disconnect'); ws = null; }
    setStatus('disconnected');
    setInputsEnabled(false);
    configBar.style.display = 'flex';
  }

  function scheduleReconnect() { reconnectTimer = setTimeout(() => connect(), RECONNECT_DELAY); }

  // ── Event Listeners ──────────────────────────────
  connectBtn.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) disconnect();
    else connect();
  });

  sendBtn.addEventListener('click', () => {
    const text = msgInput.value.trim();
    if (!text) return;
    sendPayload(text);
    msgInput.value = '';
    msgInput.focus();
  });

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = msgInput.value.trim();
      if (!text) return;
      sendPayload(text);
      msgInput.value = '';
    }
  });

  msgInput.addEventListener('paste', (e) => {
    const items = e.clipboardData.items;
    for (let i = 0; i < items.length; i++) {
      const type = items[i].type;
      if (type.indexOf('image') !== -1) {
        e.preventDefault();
        const file = items[i].getAsFile();
        if (file.size > MAX_IMAGE_SIZE) {
          addMessage(`⚠️ Image too large. Max size: ${MAX_IMAGE_SIZE / 1024 / 1024}MB`, 'system');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => sendPayload(event.target.result);
        reader.readAsDataURL(file);
        return;
      } else if (type.indexOf('video') !== -1) {
        e.preventDefault();
        const file = items[i].getAsFile();
        if (file.size > MAX_VIDEO_SIZE) {
          addMessage(`⚠️ Video too large. Max size: ${MAX_VIDEO_SIZE / 1024 / 1024}MB`, 'system');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => sendPayload(event.target.result);
        reader.readAsDataURL(file);
        return;
      }
    }
  });

  // Lightbox
  function openLightbox(src) { lightboxImg.src = src; lightbox.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
  function closeLightbox() { lightbox.classList.add('hidden'); document.body.style.overflow = ''; setTimeout(() => lightboxImg.src = '', 200); }
  messagesEl.addEventListener('click', (e) => { if (e.target.classList.contains('chat-image')) openLightbox(e.target.src); });
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox(); });

  addMessage('Welcome! Enter a WebSocket URL and click Connect.', 'system');
})();
</script>
</body>
</html>
