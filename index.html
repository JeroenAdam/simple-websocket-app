<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Chat</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Segoe UI', 'system-ui', '-apple-system', 'sans-serif'] },
          animation: { 'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
        }
      }
    }
  </script>
  <!-- Custom Scrollbar Styles -->
  <style>
    /* WebKit (Chrome, Safari, Edge) */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    #messages::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Firefox */
    #messages { scrollbar-width: thin; scrollbar-color: #475569 transparent; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center font-sans">

  <!-- App Container -->
  <div class="w-full max-w-[480px] h-[80vh] bg-slate-800 rounded-xl shadow-2xl overflow-hidden flex flex-col relative border border-slate-700">
    
    <!-- Header -->
    <header class="flex items-center justify-between px-5 py-4 bg-slate-900 border-b border-slate-700 shrink-0">
      <h1 class="text-lg font-semibold text-white flex items-center gap-2">
        <span>⚡</span> WebSocket Chat
      </h1>
      
      <!-- Status Badge -->
      <div id="statusBadge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium transition-colors duration-300 bg-slate-700 text-slate-400">
        <span class="w-2 h-2 rounded-full bg-current"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- Messages Area -->
    <div id="messages" class="flex-1 overflow-y-auto p-5 flex flex-col gap-3 scroll-smooth">
      <!-- Messages will be injected here by JS -->
    </div>

    <!-- Connection Config (Hidden when connected) -->
    <div id="configBar" class="flex items-center gap-2 px-5 py-3 bg-slate-900 border-t border-slate-700 shrink-0">
      <label for="wsUrl" class="text-xs text-slate-500 font-medium uppercase tracking-wide">WS URL:</label>
      <input id="wsUrl" type="text" value="ws://192.168.0.1" placeholder="ws://..." 
             class="flex-1 bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 transition-colors disabled:opacity-50" />
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-slate-900 border-t border-slate-700 shrink-0">
      <div class="flex gap-2">
        <button id="connectBtn" class="px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors bg-blue-600 text-white hover:bg-blue-700 active:scale-95">Connect</button>
        
        <input id="msgInput" type="text" placeholder="Type a message…" disabled 
               class="flex-1 bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" />
               
        <button id="sendBtn" class="px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors bg-sky-500 text-white hover:bg-sky-600 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">Send</button>
      </div>
    </div>

  </div>

<!-- ── Application Script ────────────────────────── -->
<script>
(() => {
  // ── DOM refs ────────────────────────────────────
  const messagesEl   = document.getElementById('messages');
  const msgInput     = document.getElementById('msgInput');
  const sendBtn      = document.getElementById('sendBtn');
  const connectBtn   = document.getElementById('connectBtn');
  const statusBadge  = document.getElementById('statusBadge');
  const statusText   = document.getElementById('statusText');
  const wsUrlInput   = document.getElementById('wsUrl');
  const configBar    = document.getElementById('configBar');

  // ── State ───────────────────────────────────────
  let ws = null;
  let reconnectTimer = null;
  const RECONNECT_DELAY = 3000;

  // ── Helpers ─────────────────────────────────────
  function timestamp() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Helper to create message HTML with Tailwind classes
  function createMessageHTML(text, type) {
    const time = timestamp();
    
    if (type === 'system') {
      return `
        <div class="self-center text-xs italic text-slate-500 my-2">
          ${text} <span class="opacity-50 mx-1">•</span> ${time}
        </div>`;
    }

    if (type === 'sent') {
      return `
        <div class="self-end flex flex-col items-end animate-[fadeIn_0.2s_ease-out]">
          <div class="bg-blue-600 text-white px-4 py-2 rounded-2xl rounded-tr-sm shadow-md break-words leading-relaxed">
            ${text}
          </div>
          <span class="text-[10px] text-slate-500 mt-1 mr-1">${time}</span>
        </div>`;
    }

    // Received / User
    return `
      <div class="self-start flex flex-col items-start animate-[fadeIn_0.2s_ease-out]">
        <div class="bg-slate-700 text-slate-100 px-4 py-2 rounded-2xl rounded-tl-sm shadow-md break-words leading-relaxed">
          ${text}
        </div>
        <span class="text-[10px] text-slate-500 mt-1 ml-1">${time}</span>
      </div>`;
  }

  function addMessage(text, type = 'system') {
    const div = document.createElement('div');
    // We use innerHTML here because the string contains multiple elements (message bubble + timestamp)
    div.innerHTML = createMessageHTML(text, type);
    messagesEl.appendChild(div);
    
    // Scroll to bottom
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function setStatus(state) {
    if (state === 'connected') {
      statusBadge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium transition-colors duration-300 bg-emerald-900/50 text-emerald-400 border border-emerald-800";
      statusText.textContent = 'Connected';
      // Pulse animation on the dot
      const dot = statusBadge.querySelector('span'); 
      if(dot) dot.classList.add('animate-pulse-slow');
    } else {
      statusBadge.className = "flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium transition-colors duration-300 bg-red-900/50 text-red-400 border border-red-800";
      statusText.textContent = 'Disconnected';
      const dot = statusBadge.querySelector('span'); 
      if(dot) dot.classList.remove('animate-pulse-slow');
    }
  }

  function setInputsEnabled(enabled) {
    msgInput.disabled   = !enabled;
    sendBtn.disabled    = !enabled;
    wsUrlInput.disabled = enabled;
    
    if (enabled) {
      connectBtn.textContent = 'Disconnect';
      connectBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
      connectBtn.classList.add('bg-red-900', 'text-red-200', 'hover:bg-red-800');
    } else {
      connectBtn.textContent = 'Connect';
      connectBtn.classList.remove('bg-red-900', 'text-red-200', 'hover:bg-red-800');
      connectBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700');
    }
  }

  // ── WebSocket Logic ─────────────────────────────
  function connect() {
    const url = wsUrlInput.value.trim();
    if (!url) return addMessage('Please enter a WebSocket URL.', 'system');

    disconnect(); // clean up any existing connection

    addMessage(`Connecting to ${url}…`, 'system');
    setStatus('disconnected');

    try {
      ws = new WebSocket(url);
    } catch (err) {
      addMessage(`Invalid URL: ${err.message}`, 'system');
      return;
    }

    ws.onopen = () => {
      setStatus('connected');
      setInputsEnabled(true);
      addMessage('Connected! You can now send messages.', 'system');
      configBar.style.display = 'none'; // Hide URL input on success
      
      // Focus the message input when connected
      setTimeout(() => msgInput.focus(), 200);
    };

    ws.onmessage = (event) => {
      const raw = event.data;
      
      if (raw.startsWith('[system] ')) {
        addMessage(raw.slice(9), 'system');
      } else if (raw.startsWith('[') && raw.includes('] ')) {
        // Extract name and message
        const splitIdx = raw.indexOf('] ');
        const name = raw.substring(1, splitIdx);
        const text = raw.substring(splitIdx + 2);
        addMessage(`[${name}] ${text}`, 'received');
      } else {
        addMessage(raw, 'received');
      }
    };

    ws.onerror = () => {
      // handled in onclose mostly
    };

    ws.onclose = (event) => {
      setStatus('disconnected');
      setInputsEnabled(false);
      configBar.style.display = 'flex';

      if (!event.wasClean) {
        addMessage(`Connection lost (code ${event.code}). Reconnecting in ${RECONNECT_DELAY / 1000}s…`, 'system');
        scheduleReconnect();
      } else {
        addMessage('Disconnected by server.', 'system');
      }
    };
  }

  function disconnect() {
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    if (ws) {
      ws.close(1000, 'Client disconnect');
      ws = null;
    }
    setStatus('disconnected');
    setInputsEnabled(false);
    configBar.style.display = 'flex';
  }

  function scheduleReconnect() {
    reconnectTimer = setTimeout(() => connect(), RECONNECT_DELAY);
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(text);
    addMessage(text, 'sent');
    msgInput.value = '';
    msgInput.focus();
  }

  // ── Event Listeners ─────────────────────────────
  connectBtn.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      disconnect();
    } else {
      connect();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // ── Boot ────────────────────────────────────────
  addMessage('Welcome! Enter a WebSocket URL and click Connect.', 'system');
})();
</script>

</body>
</html>
